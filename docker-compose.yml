
services:
  userservice:
    build:
      context: .
      dockerfile: UserService.Api/Dockerfile
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5434;Database=university_db;Username=postgres;Password=Password2!
    depends_on:
      - db

  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password2!
      POSTGRES_DB: university_db
    ports:
      - "5434:5434"
